$kind: http-request
description: Submit candidate answer for the active session question and evaluate it using Qwen 2.5 on Ollama.
url: "{{baseUrl}}/api/v1/interview/sessions/:session_id/answers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  session_id: string
body:
  type: json
  content: |-
    {
      "candidate_answer": "string",
      "question_number": 5
    }
settings: {}
examples: ./.resources/Submit and Evaluate Candidate Answer for Session.resources/examples
order: 1000
