$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/interview/sessions/:session_id/next-question"
  method: POST
  headers:
    Accept: application/json
  pathVariables:
    session_id: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "session_id": "string",
        "question_number": 5,
        "total_questions": 15,
        "question": "string",
        "expected_answer_points": [
          "string",
          "string"
        ],
        "difficulty": "Medium",
        "topic": "string",
        "follow_up_question": "string"
      }
order: 1000
