$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/interview/question"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "role": "string",
        "experience_level": "Senior",
        "difficulty": "Hard",
        "topic": "string",
        "question_type": "Behavioral"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "question": "string",
        "expected_answer_points": [
          "string"
        ],
        "follow_up_question": "string",
        "difficulty": "Easy",
        "topic": "string"
      }
order: 1000
