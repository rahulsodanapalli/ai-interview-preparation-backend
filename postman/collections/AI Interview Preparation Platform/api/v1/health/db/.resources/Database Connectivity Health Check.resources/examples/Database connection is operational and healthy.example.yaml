$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/health/db"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "database_connected": false,
        "database_configured": false,
        "database": "postgresql"
      }
order: 1000
